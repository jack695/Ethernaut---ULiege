services:
  blockchain:
    build:
      context: .
    command: network
    networks: 
      - app_network
    ports:
      - "8545:8545"
  init-blockchain:
    build:
      context: .
    entrypoint: sh -c "sleep 10 && yarn deploy:contracts && sleep 10"
    depends_on:
      blockchain:
        condition: service_started
    networks: 
      - app_network
    restart: on-failure
    volumes:
      - ./client/src/gamedata:/ethernaut/client/src/gamedata
  website:
    build:
      context: .
    command: start:ethernaut
    depends_on:
      init-blockchain:
        condition: service_completed_successfully
    networks: 
      - app_network
    ports:
      - "3000:3000"
    volumes:
      - ./client/src/gamedata:/ethernaut/client/src/gamedata

networks:
  app_network:
    driver: bridge